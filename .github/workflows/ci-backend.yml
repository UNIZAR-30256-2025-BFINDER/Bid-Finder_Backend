name: Backend CI

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  integracion-continua:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Instalar dependencias
      run: npm ci

    - name: Pasar el Linter (ESLint)
      run: npx eslint .

    - name: Ejecutar Tests Unitarios y calcular cobertura (Jest)
      run: npm run test -- --coverage

    - name: Subir artefacto de cobertura a GitHub
      uses: actions/upload-artifact@v4
      with:
        name: backend-coverage-report
        path: coverage/
        retention-days: 14 

    - name: Test de construcción de Docker
      run: docker build -t bidfinder-backend:ci-test .
    
  despliegue:
    needs: integracion-continua 
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}