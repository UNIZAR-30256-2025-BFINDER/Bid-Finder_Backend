# render.yaml
services:
  - type: web
    name: bidfinder-backend
    env: node
    branch: main
    buildCommand: npm install
    startCommand: node app.js 
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false