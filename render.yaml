services:
  - type: web
    name: bidfinder-backend
    env: node
    branch: main
    buildCommand: npm install
    startCommand: node app.js 
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

  - type: cron
    name: bidfinder-boe-pipeline
    env: node
    branch: main
    schedule: "0 8 * * *" # Se ejecuta a las 08:00 AM (Hora UTC)
    buildCommand: npm install
    startCommand: node app_server/jobs/dailyPipeline.js
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false